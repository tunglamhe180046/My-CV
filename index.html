<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Tùng Lâm | Trung Tâm Quản Lý & Xuất CV Đa Mẫu</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- HTML2PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Single Source of Truth CV Data -->
    <script src="cv-data.js"></script>

    <style>
        /* Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #334155;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        /* --- Master Top Navigation Bar --- */
        .cv-hub-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        }

        .hub-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 15px;
            color: #38bdf8;
            letter-spacing: 0.3px;
        }
        .hub-brand img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            object-fit: cover;
        }
        .hub-brand .brand-sub {
            font-size: 11px;
            font-weight: 400;
            color: #94a3b8;
            display: block;
        }

        .hub-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .form-select-wrapper i {
            position: absolute;
            left: 12px;
            color: #38bdf8;
            pointer-events: none;
            font-size: 13px;
        }

        .hub-select {
            appearance: none;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 34px 8px 32px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .hub-select:hover, .hub-select:focus {
            border-color: #38bdf8;
            background: #243248;
        }

        .hub-btn {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .hub-btn:hover {
            background: #334155;
            color: #ffffff;
            border-color: #475569;
        }
        .hub-btn.btn-primary {
            background: #2563eb;
            border-color: #3b82f6;
            color: #ffffff;
        }
        .hub-btn.btn-primary:hover {
            background: #1d4ed8;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
        }
        .hub-btn.btn-accent {
            background: #0d9488;
            border-color: #14b8a6;
            color: #ffffff;
        }
        .hub-btn.btn-accent:hover {
            background: #0f766e;
        }

        /* --- Viewer Main Workspace --- */
        .cv-stage {
            padding-top: 80px;
            padding-bottom: 50px;
            display: flex;
            justify-content: center;
            background: #0b1120;
            min-height: 100vh;
        }

        .render-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* ====================================================================
           STYLES: HARVARD ATS THEME (Dành cho Harvard Tiếng Việt & Tiếng Anh)
           ==================================================================== */
        .harvard-document {
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            color: #000000;
            font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
            font-size: 13.5px;
            line-height: 1.45;
            padding: 48px 56px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border-radius: 2px;
        }

        .harvard-document header.cv-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .harvard-document header.cv-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #000000;
            line-height: 1.15;
        }
        .harvard-document header.cv-header .subtitle {
            font-size: 14px;
            font-style: italic;
            margin-bottom: 8px;
            color: #222222;
        }
        .harvard-document header.cv-header .contact-line {
            font-size: 12.5px;
            color: #111111;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px 10px;
        }
        .harvard-document header.cv-header .contact-line a {
            color: #000000;
            text-decoration: none;
        }
        .harvard-document header.cv-header .contact-line a:hover {
            text-decoration: underline;
        }
        .harvard-document header.cv-header .separator {
            color: #666666;
        }

        .harvard-document .cv-section {
            margin-bottom: 18px;
        }
        .harvard-document .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #000000;
            padding-bottom: 2px;
            margin-bottom: 10px;
            color: #000000;
        }
        .harvard-document .entry {
            margin-bottom: 12px;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .harvard-document .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .harvard-document .entry-title {
            font-weight: 700;
            font-size: 14px;
            color: #000000;
        }
        .harvard-document .entry-subtitle {
            font-style: italic;
            font-size: 13px;
            color: #111111;
        }
        .harvard-document .entry-date, .harvard-document .entry-location {
            font-weight: 700;
            font-size: 13px;
            color: #000000;
            text-align: right;
            white-space: nowrap;
        }
        .harvard-document ul.bullet-list {
            list-style-type: disc;
            margin-top: 4px;
            margin-bottom: 4px;
            padding-left: 18px;
        }
        .harvard-document ul.bullet-list li {
            margin-bottom: 3px;
            color: #111111;
            text-align: justify;
        }
        .harvard-document ul.bullet-list li strong {
            color: #000000;
        }
        .harvard-document .skills-row {
            margin-bottom: 5px;
            color: #111111;
        }
        .harvard-document .skills-row strong {
            color: #000000;
            font-weight: 700;
        }

        /* ====================================================================
           STYLES: MODERN VISUAL 2-COLUMN THEME (Tiếng Việt & English)
           ==================================================================== */
        .modern-document {
            width: 100%;
            max-width: 1080px;
            background: #ffffff;
            color: #172033;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 14.5px;
            line-height: 1.55;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            overflow: hidden;
        }

        .modern-document .top-header {
            background: linear-gradient(125deg, #173f9c, #2874eb);
            color: #ffffff;
            padding: 38px 48px;
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 28px;
            align-items: center;
        }
        .modern-document .top-header .photo {
            width: 120px;
            height: 120px;
            border: 4px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            overflow: hidden;
            background: #ffffff;
        }
        .modern-document .top-header .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modern-document .top-header h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: -0.8px;
            line-height: 1.1;
            color: #ffffff;
            font-weight: 800;
        }
        .modern-document .top-header .headline {
            margin: 6px 0 12px;
            font-size: 16px;
            font-weight: 500;
            color: #e7efff;
        }
        .modern-document .top-header .contact-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            font-size: 13px;
        }
        .modern-document .top-header .contact-grid span {
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .modern-document .top-header .contact-grid a {
            color: #ffffff;
            text-decoration: none;
        }
        .modern-document .top-header .contact-grid a:hover {
            text-decoration: underline;
        }

        .modern-document main.modern-main {
            padding: 34px 48px 40px;
        }
        .modern-document .modern-summary {
            font-size: 14.5px;
            color: #344156;
            margin-bottom: 28px;
            line-height: 1.6;
            background: #f8fafc;
            padding: 16px 20px;
            border-left: 4px solid #2563eb;
            border-radius: 0 6px 6px 0;
        }
        .modern-document .modern-layout {
            display: grid;
            grid-template-columns: 34% 1fr;
            gap: 36px;
        }
        .modern-document section {
            margin-bottom: 26px;
        }
        .modern-document h2 {
            margin: 0 0 14px;
            color: #1646ab;
            font-size: 14.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }
        .modern-document h2::after {
            content: "";
            height: 1px;
            background: #dce4f1;
            flex: 1;
        }
        .modern-document .skill-group {
            margin-bottom: 14px;
            break-inside: avoid;
        }
        .modern-document .skill-group strong {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #1e293b;
        }
        .modern-document .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .modern-document .tag {
            background: #eff4ff;
            color: #244d9b;
            border: 1px solid #dae6ff;
            border-radius: 4px;
            padding: 3px 7px;
            font-size: 11.5px;
            font-weight: 500;
        }
        .modern-document .timeline-item {
            position: relative;
            padding: 0 0 20px 18px;
            border-left: 2px solid #dce4f1;
            break-inside: avoid;
        }
        .modern-document .timeline-item:last-child {
            padding-bottom: 0;
        }
        .modern-document .timeline-item::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2563eb;
        }
        .modern-document .item-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .modern-document .item-head h3 {
            font-size: 14.5px;
            font-weight: 700;
            color: #0f172a;
        }
        .modern-document .item-head .date {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
        }
        .modern-document .sub {
            color: #2563eb;
            font-size: 13px;
            font-weight: 600;
            margin: 2px 0 6px;
        }
        .modern-document ul.mod-list {
            margin: 6px 0 0;
            padding-left: 16px;
            color: #3f4a5c;
            font-size: 13px;
        }
        .modern-document ul.mod-list li {
            margin: 3px 0;
            text-align: justify;
        }

        .modern-document .project-card {
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fbfcfe;
            break-inside: avoid;
        }
        .modern-document .project-card .p-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }
        .modern-document .project-card .p-tech {
            font-size: 12px;
            color: #2563eb;
            font-weight: 500;
            margin: 3px 0 6px;
        }
        .modern-document .project-card .p-links {
            margin-top: 6px;
            font-size: 12px;
        }
        .modern-document .project-card .p-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* ====================================================================
           STYLES: LIVE DATA EDITOR MODAL
           ==================================================================== */
        .editor-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }
        .editor-modal-overlay.active {
            display: flex;
        }
        .editor-modal {
            background: #1e293b;
            color: #f8fafc;
            width: 100%;
            max-width: 860px;
            max-height: 90vh;
            border-radius: 10px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .editor-modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
        }
        .editor-modal-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .editor-modal-header .close-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
        }
        .editor-modal-header .close-btn:hover {
            color: #ffffff;
        }
        .editor-modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .editor-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .editor-tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .editor-tab-btn.active {
            background: #2563eb;
            color: #ffffff;
        }
        .form-row {
            margin-bottom: 14px;
        }
        .form-row label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .form-row input, .form-row textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 12px;
            color: #ffffff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }
        .form-row input:focus, .form-row textarea:focus {
            border-color: #38bdf8;
        }
        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .editor-modal-footer {
            padding: 14px 24px;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Print Mode Optimization --- */
        @media print {
            body {
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .cv-hub-bar, .editor-modal-overlay {
                display: none !important;
            }
            .cv-stage {
                padding: 0 !important;
                background: #ffffff !important;
            }
            .harvard-document, .modern-document {
                box-shadow: none !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border-radius: 0 !important;
            }
            @page {
                margin: 1.2cm 1.5cm;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================
         TOP MASTER NAVIGATION BAR
         ========================================== -->
    <header class="cv-hub-bar" data-html2canvas-ignore="true">
        <div class="hub-brand">
            <img src="anh.jpg" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=Nguyen+Tung+Lam&background=2563eb&color=fff'">
            <div>
                <span>NGUYỄN TÙNG LÂM</span>
                <span class="brand-sub">Trung Tâm Quản Lý CV Đa Mẫu</span>
            </div>
        </div>

        <div class="hub-controls">
            <!-- Form Selector -->
            <div class="form-select-wrapper">
                <i class="fa-solid fa-layer-group"></i>
                <select id="formSelector" class="hub-select" onchange="switchForm(this.value)">
                    <option value="harvard-vi" selected>🇻🇳 Harvard Tiếng Việt (ATS)</option>
                    <option value="harvard-en">🇬🇧 Harvard English (ATS)</option>
                    <option value="modern-vi">🎨 Modern Visual (Tiếng Việt)</option>
                    <option value="modern-en">🎨 Modern Visual (English)</option>
                    <option value="portfolio">🌐 Web Portfolio Cũ</option>
                </select>
            </div>

            <!-- Live Data Editor Button -->
            <button type="button" class="hub-btn btn-accent" onclick="openEditorModal()">
                <i class="fa-solid fa-pen-to-square"></i> <span>Sửa Dữ Liệu Live</span>
            </button>

            <!-- Export / Print -->
            <button type="button" class="hub-btn" onclick="window.print()">
                <i class="fa-solid fa-print"></i> <span>In / Lưu PDF</span>
            </button>
            <button type="button" class="hub-btn btn-primary" onclick="exportPDF()">
                <i class="fa-solid fa-file-arrow-down"></i> <span>Tải PDF</span>
            </button>
        </div>
    </header>

    <!-- ==========================================
         CV RENDERING STAGE
         ========================================== -->
    <main class="cv-stage">
        <div class="render-container" id="cvContainer">
            <!-- Dynamic CV Template will be injected here -->
        </div>
    </main>

    <!-- ==========================================
         LIVE DATA EDITOR MODAL
         ========================================== -->
    <div class="editor-modal-overlay" id="editorModal">
        <div class="editor-modal">
            <div class="editor-modal-header">
                <h3><i class="fa-solid fa-database"></i> Chỉnh Sửa Dữ Liệu CV Gốc (Source of Truth)</h3>
                <button type="button" class="close-btn" onclick="closeEditorModal()">&times;</button>
            </div>
            <div class="editor-modal-body">
                <div class="editor-tabs">
                    <button type="button" class="editor-tab-btn active" onclick="switchEditorTab('basic')">Thông tin cá nhân & Giới thiệu</button>
                    <button type="button" class="editor-tab-btn" onclick="switchEditorTab('json')">Chỉnh sửa JSON trực tiếp</button>
                </div>

                <!-- Tab 1: Form Fields -->
                <div id="tab-basic">
                    <div class="form-grid-2">
                        <div class="form-row">
                            <label>Họ và Tên (Tiếng Việt)</label>
                            <input type="text" id="edit-name-vi">
                        </div>
                        <div class="form-row">
                            <label>Họ và Tên (Tiếng Anh)</label>
                            <input type="text" id="edit-name-en">
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-row">
                            <label>Vị trí / Chức danh (Tiếng Việt)</label>
                            <input type="text" id="edit-title-vi">
                        </div>
                        <div class="form-row">
                            <label>Vị trí / Chức danh (Tiếng Anh)</label>
                            <input type="text" id="edit-title-en">
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-row">
                            <label>Số điện thoại</label>
                            <input type="text" id="edit-phone">
                        </div>
                        <div class="form-row">
                            <label>Email</label>
                            <input type="email" id="edit-email">
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-row">
                            <label>LinkedIn URL</label>
                            <input type="text" id="edit-linkedin">
                        </div>
                        <div class="form-row">
                            <label>GitHub URL</label>
                            <input type="text" id="edit-github">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Tóm tắt / Tổng quan năng lực (Tiếng Việt - harvard-vi)</label>
                        <textarea rows="4" id="edit-summary-vi"></textarea>
                    </div>
                    <div class="form-row">
                        <label>Tóm tắt / Professional Summary (Tiếng Anh - harvard-en)</label>
                        <textarea rows="4" id="edit-summary-en"></textarea>
                    </div>
                </div>

                <!-- Tab 2: Full JSON Editor -->
                <div id="tab-json" style="display: none;">
                    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">
                        Bạn có thể sửa toàn bộ dữ liệu cấu trúc (Học vấn, Kinh nghiệm làm việc, Dự án, Kỹ năng, Ngoại ngữ). Khi lưu, tất cả các mẫu CV sẽ lập tức cập nhật tự động!
                    </p>
                    <textarea rows="18" id="json-editor-area" style="font-family: monospace; font-size: 12px;"></textarea>
                </div>
            </div>
            <div class="editor-modal-footer">
                <div>
                    <button type="button" class="hub-btn" onclick="resetToDefaultData()" style="color: #f87171;">
                        <i class="fa-solid fa-rotate-left"></i> Khôi phục dữ liệu gốc
                    </button>
                    <button type="button" class="hub-btn" onclick="downloadDataFile()">
                        <i class="fa-solid fa-download"></i> Tải file cv-data.js
                    </button>
                </div>
                <div>
                    <button type="button" class="hub-btn" onclick="closeEditorModal()">Đóng</button>
                    <button type="button" class="hub-btn btn-primary" onclick="saveEditorData()">
                        <i class="fa-solid fa-check"></i> Lưu & Áp Dụng Ngay
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         RENDER ENGINE JAVASCRIPT
         ========================================== -->
    <script>
        let currentForm = 'harvard-vi';

        // Initialize from URL query param if present
        function initFormFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const formParam = params.get('form');
            if (formParam && ['harvard-vi', 'harvard-en', 'modern-vi', 'modern-en', 'portfolio'].includes(formParam)) {
                currentForm = formParam;
            }
            const selectEl = document.getElementById('formSelector');
            if (selectEl) selectEl.value = currentForm;
        }

        // Switch Form handler
        function switchForm(formId) {
            if (formId === 'portfolio') {
                window.location.href = 'portfolio-old.html';
                return;
            }
            currentForm = formId;
            const url = new URL(window.location);
            url.searchParams.set('form', formId);
            window.history.replaceState({}, '', url);
            renderCurrentCV();
        }

        // Main Render Function
        function renderCurrentCV() {
            const data = window.CVDataService.get();
            const container = document.getElementById('cvContainer');
            if (!container) return;

            if (currentForm === 'harvard-vi') {
                container.innerHTML = renderHarvardTemplate(data, 'vi');
                document.title = `${data.personal.name.vi} - CV Chuẩn Harvard (Tiếng Việt)`;
            } else if (currentForm === 'harvard-en') {
                container.innerHTML = renderHarvardTemplate(data, 'en');
                document.title = `${data.personal.name.en} - Harvard Resume (English)`;
            } else if (currentForm === 'modern-vi') {
                container.innerHTML = renderModernTemplate(data, 'vi');
                document.title = `${data.personal.name.vi} - Modern CV (Tiếng Việt)`;
            } else if (currentForm === 'modern-en') {
                container.innerHTML = renderModernTemplate(data, 'en');
                document.title = `${data.personal.name.en} - Modern CV (English)`;
            }
        }

        // ========================================================
        // TEMPLATE 1: HARVARD ATS STANDARD (Tiếng Việt & English)
        // ========================================================
        function renderHarvardTemplate(data, lang) {
            const p = data.personal;
            const isVi = lang === 'vi';
            
            // Labels
            const L = {
                summaryTitle: isVi ? "Tổng Quan Năng Lực" : "Professional Summary",
                educationTitle: isVi ? "Học Vấn" : "Education",
                experienceTitle: isVi ? "Kinh Nghiệm Làm Việc" : "Work Experience",
                projectsTitle: isVi ? "Dự Án Nổi Bật" : "Key Projects",
                skillsTitle: isVi ? "Kỹ Năng Chuyên Môn" : "Technical Skills & Competencies",
                langCertTitle: isVi ? "Ngoại Ngữ, Chứng Chỉ & Hoạt Động" : "Languages, Certifications & Activities",
                techLabel: isVi ? "Công nghệ" : "Tech Stack"
            };

            // Experience HTML
            const expHtml = data.experience.map(exp => {
                const highlights = (exp.highlights[lang] || exp.highlights.vi || []).map(item => `<li>${item}</li>`).join('');
                return `
                    <div class="entry">
                        <div class="entry-header">
                            <span class="entry-title">${exp.company[lang] || exp.company.vi}</span>
                            <span class="entry-location">${exp.location[lang] || exp.location.vi}</span>
                        </div>
                        <div class="entry-header">
                            <span class="entry-subtitle">${exp.role[lang] || exp.role.vi}</span>
                            <span class="entry-date">${exp.period[lang] || exp.period.vi}</span>
                        </div>
                        <ul class="bullet-list">${highlights}</ul>
                    </div>
                `;
            }).join('');

            // Projects HTML
            const projHtml = data.projects.map(proj => {
                const highlights = (proj.highlights[lang] || proj.highlights.vi || []).map(item => `<li>${item}</li>`).join('');
                const githubRow = proj.github ? `<div class="entry-subtitle">GitHub: <a href="${proj.github}" target="_blank" rel="noopener">${proj.githubDisplay || proj.github}</a></div>` : '';
                return `
                    <div class="entry">
                        <div class="entry-header">
                            <span class="entry-title">${proj.name[lang] || proj.name.vi}</span>
                            <span class="entry-date">${proj.period}</span>
                        </div>
                        <div class="entry-subtitle">${L.techLabel}: ${proj.tech}</div>
                        ${githubRow}
                        <ul class="bullet-list">${highlights}</ul>
                    </div>
                `;
            }).join('');

            // Education HTML
            const eduHtml = data.education.map(edu => `
                <div class="entry">
                    <div class="entry-header">
                        <span class="entry-title">${edu.school[lang] || edu.school.vi}</span>
                        <span class="entry-location">${edu.location[lang] || edu.location.vi}</span>
                    </div>
                    <div class="entry-header">
                        <span class="entry-subtitle">${edu.degree[lang] || edu.degree.vi}</span>
                        <span class="entry-date">${edu.period[lang] || edu.period.vi}</span>
                    </div>
                </div>
            `).join('');

            // Skills HTML
            const skillsHtml = data.skills.map(s => `
                <div class="skills-row">
                    <strong>${s.category[lang] || s.category.vi}:</strong> ${s.content[lang] || s.content.vi}
                </div>
            `).join('');

            // Languages & Certs
            const lc = data.languagesAndCertifications;
            const langCertHtml = `
                <ul class="bullet-list">
                    <li><strong>${lc.languages.label[lang] || lc.languages.label.vi}:</strong> ${lc.languages[lang] || lc.languages.vi}</li>
                    <li><strong>${lc.certifications.label[lang] || lc.certifications.label.vi}:</strong> ${lc.certifications[lang] || lc.certifications.vi}</li>
                    <li><strong>${lc.activities.label[lang] || lc.activities.label.vi}:</strong> ${lc.activities[lang] || lc.activities.vi}</li>
                </ul>
            `;

            return `
                <div class="harvard-document" id="cv-document">
                    <header class="cv-header">
                        <h1>${p.name[lang] || p.name.vi}</h1>
                        <div class="subtitle">${p.title[lang] || p.title.vi}</div>
                        <div class="contact-line">
                            <span>${p.location[lang] || p.location.vi}</span>
                            <span class="separator">|</span>
                            <span>${isVi ? p.phone : (p.phoneFormatted || p.phone)}</span>
                            <span class="separator">|</span>
                            <span><a href="mailto:${p.email}">${p.email}</a></span>
                            <span class="separator">|</span>
                            <span><a href="${p.linkedin}" target="_blank">${p.linkedinDisplay}</a></span>
                            <span class="separator">|</span>
                            <span><a href="${p.github}" target="_blank">${p.githubDisplay}</a></span>
                        </div>
                    </header>

                    <section class="cv-section">
                        <div class="section-title">${L.summaryTitle}</div>
                        <p style="text-align: justify; color: #111111;">${data.summary[lang] || data.summary.vi}</p>
                    </section>

                    <section class="cv-section">
                        <div class="section-title">${L.educationTitle}</div>
                        ${eduHtml}
                    </section>

                    <section class="cv-section">
                        <div class="section-title">${L.experienceTitle}</div>
                        ${expHtml}
                    </section>

                    <section class="cv-section">
                        <div class="section-title">${L.projectsTitle}</div>
                        ${projHtml}
                    </section>

                    <section class="cv-section">
                        <div class="section-title">${L.skillsTitle}</div>
                        ${skillsHtml}
                    </section>

                    <section class="cv-section">
                        <div class="section-title">${L.langCertTitle}</div>
                        ${langCertHtml}
                    </section>
                </div>
            `;
        }

        // ========================================================
        // TEMPLATE 2: MODERN VISUAL 2-COLUMN (Tiếng Việt & English)
        // ========================================================
        function renderModernTemplate(data, lang) {
            const p = data.personal;
            const isVi = lang === 'vi';

            const L = {
                skillsTitle: isVi ? "Kỹ Năng Kỹ Thuật" : "Technical Skills",
                experienceTitle: isVi ? "Kinh Nghiệm Làm Việc" : "Work Experience",
                projectsTitle: isVi ? "Dự Án Nổi Bật" : "Key Projects",
                educationTitle: isVi ? "Học Vấn" : "Education",
                languagesTitle: isVi ? "Ngoại Ngữ" : "Languages",
                activitiesTitle: isVi ? "Hoạt Động" : "Activities",
                certTitle: isVi ? "Chứng Chỉ" : "Certifications"
            };

            // Sidebar Skills with Tags
            const sidebarSkills = data.skills.map(s => {
                const tagList = (s.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
                return `
                    <div class="skill-group">
                        <strong>${s.category[lang] || s.category.vi}</strong>
                        <div class="tags">${tagList}</div>
                    </div>
                `;
            }).join('');

            // Sidebar Education
            const sidebarEdu = data.education.map(e => `
                <div style="margin-bottom: 12px;">
                    <div style="font-weight: 700; font-size: 13px; color: #0f172a;">${e.school[lang] || e.school.vi}</div>
                    <div style="font-size: 12.5px; color: #475569;">${e.degree[lang] || e.degree.vi}</div>
                    <div style="font-size: 11.5px; color: #64748b; font-weight: 600;">${e.period[lang] || e.period.vi}</div>
                </div>
            `).join('');

            // Timeline Experience
            const timelineExp = data.experience.map(exp => {
                const items = (exp.highlights[lang] || exp.highlights.vi || []).map(h => `<li>${h}</li>`).join('');
                return `
                    <div class="timeline-item">
                        <div class="item-head">
                            <h3>${exp.role[lang] || exp.role.vi}</h3>
                            <span class="date">${exp.period[lang] || exp.period.vi}</span>
                        </div>
                        <div class="sub">${exp.company[lang] || exp.company.vi} — ${exp.location[lang] || exp.location.vi}</div>
                        <ul class="mod-list">${items}</ul>
                    </div>
                `;
            }).join('');

            // Projects Cards
            const projectCards = data.projects.map(proj => {
                const items = (proj.highlights[lang] || proj.highlights.vi || []).map(h => `<li>${h}</li>`).join('');
                const link = proj.github ? `<div class="p-links"><a href="${proj.github}" target="_blank"><i class="fa-brands fa-github"></i> ${proj.githubDisplay || proj.github}</a></div>` : '';
                return `
                    <div class="project-card">
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <span class="p-title">${proj.name[lang] || proj.name.vi}</span>
                            <span style="font-size: 12px; font-weight: 600; color: #64748b;">${proj.period}</span>
                        </div>
                        <div class="p-tech"><i class="fa-solid fa-code"></i> ${proj.tech}</div>
                        <ul class="mod-list">${items}</ul>
                        ${link}
                    </div>
                `;
            }).join('');

            const lc = data.languagesAndCertifications;

            return `
                <div class="modern-document" id="cv-document">
                    <header class="top-header">
                        <div class="photo">
                            <img src="${p.avatar || 'anh.jpg'}" alt="${p.name[lang]}" onerror="this.src='https://ui-avatars.com/api/?name=Nguyen+Tung+Lam&background=2563eb&color=fff'">
                        </div>
                        <div>
                            <h1>${p.name[lang] || p.name.vi}</h1>
                            <div class="headline">${p.title[lang] || p.title.vi}</div>
                            <div class="contact-grid">
                                <span><i class="fa-solid fa-location-dot"></i> ${p.location[lang] || p.location.vi}</span>
                                <span><i class="fa-solid fa-phone"></i> ${isVi ? p.phone : (p.phoneFormatted || p.phone)}</span>
                                <span><i class="fa-solid fa-envelope"></i> <a href="mailto:${p.email}">${p.email}</a></span>
                                <span><i class="fa-brands fa-linkedin"></i> <a href="${p.linkedin}" target="_blank">${p.linkedinDisplay}</a></span>
                                <span><i class="fa-brands fa-github"></i> <a href="${p.github}" target="_blank">${p.githubDisplay}</a></span>
                            </div>
                        </div>
                    </header>

                    <main class="modern-main">
                        <div class="modern-summary">
                            ${data.summary[lang] || data.summary.vi}
                        </div>

                        <div class="modern-layout">
                            <!-- Left Sidebar -->
                            <aside>
                                <section>
                                    <h2>${L.skillsTitle}</h2>
                                    ${sidebarSkills}
                                </section>

                                <section>
                                    <h2>${L.educationTitle}</h2>
                                    ${sidebarEdu}
                                </section>

                                <section>
                                    <h2>${L.languagesTitle}</h2>
                                    <p style="font-size: 13px; color: #334155; line-height: 1.5;">${lc.languages[lang] || lc.languages.vi}</p>
                                </section>

                                <section>
                                    <h2>${L.certTitle}</h2>
                                    <p style="font-size: 13px; color: #334155; line-height: 1.5;">${lc.certifications[lang] || lc.certifications.vi}</p>
                                </section>

                                <section>
                                    <h2>${L.activitiesTitle}</h2>
                                    <p style="font-size: 13px; color: #334155; line-height: 1.5;">${lc.activities[lang] || lc.activities.vi}</p>
                                </section>
                            </aside>

                            <!-- Right Main -->
                            <div>
                                <section>
                                    <h2>${L.experienceTitle}</h2>
                                    ${timelineExp}
                                </section>

                                <section>
                                    <h2>${L.projectsTitle}</h2>
                                    ${projectCards}
                                </section>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        // ========================================================
        // EXPORT PDF HANDLER (html2pdf)
        // ========================================================
        function exportPDF() {
            const element = document.getElementById('cv-document');
            if (!element) return;

            let filename = `Nguyen_Tung_Lam_CV_${currentForm}.pdf`;
            const opt = {
                margin:       [0.35, 0.4, 0.35, 0.4],
                filename:     filename,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // ========================================================
        // LIVE EDITOR MODAL LOGIC
        // ========================================================
        function openEditorModal() {
            const data = window.CVDataService.get();
            document.getElementById('edit-name-vi').value = data.personal.name.vi || '';
            document.getElementById('edit-name-en').value = data.personal.name.en || '';
            document.getElementById('edit-title-vi').value = data.personal.title.vi || '';
            document.getElementById('edit-title-en').value = data.personal.title.en || '';
            document.getElementById('edit-phone').value = data.personal.phone || '';
            document.getElementById('edit-email').value = data.personal.email || '';
            document.getElementById('edit-linkedin').value = data.personal.linkedin || '';
            document.getElementById('edit-github').value = data.personal.github || '';
            document.getElementById('edit-summary-vi').value = data.summary.vi || '';
            document.getElementById('edit-summary-en').value = data.summary.en || '';

            document.getElementById('json-editor-area').value = JSON.stringify(data, null, 2);
            document.getElementById('editorModal').classList.add('active');
        }

        function closeEditorModal() {
            document.getElementById('editorModal').classList.remove('active');
        }

        function switchEditorTab(tab) {
            const btns = document.querySelectorAll('.editor-tab-btn');
            btns.forEach(b => b.classList.remove('active'));
            if (tab === 'basic') {
                btns[0].classList.add('active');
                document.getElementById('tab-basic').style.display = 'block';
                document.getElementById('tab-json').style.display = 'none';
            } else {
                btns[1].classList.add('active');
                document.getElementById('tab-basic').style.display = 'none';
                document.getElementById('tab-json').style.display = 'block';
                // Sync current basic inputs into JSON
                syncBasicToJson();
            }
        }

        function syncBasicToJson() {
            try {
                let current = JSON.parse(document.getElementById('json-editor-area').value);
                current.personal.name.vi = document.getElementById('edit-name-vi').value;
                current.personal.name.en = document.getElementById('edit-name-en').value;
                current.personal.title.vi = document.getElementById('edit-title-vi').value;
                current.personal.title.en = document.getElementById('edit-title-en').value;
                current.personal.phone = document.getElementById('edit-phone').value;
                current.personal.email = document.getElementById('edit-email').value;
                current.personal.linkedin = document.getElementById('edit-linkedin').value;
                current.personal.github = document.getElementById('edit-github').value;
                current.summary.vi = document.getElementById('edit-summary-vi').value;
                current.summary.en = document.getElementById('edit-summary-en').value;
                document.getElementById('json-editor-area').value = JSON.stringify(current, null, 2);
            } catch(e) {}
        }

        function saveEditorData() {
            let dataToSave;
            const isJsonActive = document.getElementById('tab-json').style.display === 'block';

            if (isJsonActive) {
                try {
                    dataToSave = JSON.parse(document.getElementById('json-editor-area').value);
                } catch(e) {
                    alert('Lỗi định dạng JSON: ' + e.message);
                    return;
                }
            } else {
                dataToSave = window.CVDataService.get();
                dataToSave.personal.name.vi = document.getElementById('edit-name-vi').value;
                dataToSave.personal.name.en = document.getElementById('edit-name-en').value;
                dataToSave.personal.title.vi = document.getElementById('edit-title-vi').value;
                dataToSave.personal.title.en = document.getElementById('edit-title-en').value;
                dataToSave.personal.phone = document.getElementById('edit-phone').value;
                dataToSave.personal.email = document.getElementById('edit-email').value;
                dataToSave.personal.linkedin = document.getElementById('edit-linkedin').value;
                dataToSave.personal.github = document.getElementById('edit-github').value;
                dataToSave.summary.vi = document.getElementById('edit-summary-vi').value;
                dataToSave.summary.en = document.getElementById('edit-summary-en').value;
            }

            window.CVDataService.save(dataToSave);
            renderCurrentCV();
            closeEditorModal();
            alert('✅ Đã lưu dữ liệu thành công! Mọi form CV đã được tự động cập nhật.');
        }

        function resetToDefaultData() {
            if (confirm('Bạn có chắc chắn muốn khôi phục về dữ liệu mặc định ban đầu không? Mọi thay đổi chưa tải về sẽ bị xóa.')) {
                window.CVDataService.reset();
                renderCurrentCV();
                closeEditorModal();
                alert('Đã khôi phục dữ liệu gốc thành công!');
            }
        }

        function downloadDataFile() {
            const data = window.CVDataService.get();
            const jsContent = window.CVDataService.exportAsJS(data);
            const blob = new Blob([jsContent], { type: 'application/javascript;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'cv-data.js';
            a.click();
        }

        // On document ready
        document.addEventListener('DOMContentLoaded', () => {
            initFormFromUrl();
            renderCurrentCV();
        });
    </script>
</body>
</html>
